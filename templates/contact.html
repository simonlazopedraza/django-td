{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Contáctanos</h2>
    <form method="POST" class="col-md-6 mx-auto">
        {% csrf_token %}
        {{ formulario.as_p }}
        <div class="text-center">
            <button type="submit" class="btn btn-primary mt-3 px-5 rounded-pill">Enviar Mensaje</button>
        </div>
    </form>
</div>
{% endblock %}

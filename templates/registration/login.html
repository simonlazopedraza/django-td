{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="col-md-5 mx-auto p-4 bg-light rounded-4 shadow-sm border">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}            
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary w-100 rounded-pill">Ingresar a OnlyFlans</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
